<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Breakout</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #fff;
    font-family: Tahoma, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }
  canvas { display: block; }
  .overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 10;
    padding: 20px;
    text-align: center;
  }
  .overlay.hide { display: none; }
  .overlay h1 {
    font-size: 2.5rem;
    color: #00ffff;
    text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
    letter-spacing: 4px;
    margin-bottom: 15px;
  }
  .overlay p {
    color: #aaa;
    margin-bottom: 20px;
    font-size: 1rem;
    line-height: 2;
  }
  .btn {
    padding: 15px 50px;
    background: linear-gradient(135deg, #00ffff, #ff00ff);
    color: #000;
    border: none;
    border-radius: 30px;
    font-size: 1.2rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
    margin-top: 15px;
  }
  .btn:active { transform: scale(0.95); }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="overlay" id="overlay">
  <h1 id="title">NEON BREAKOUT</h1>
  <p id="message">
    انگشتت رو روی صفحه بکش تا راکت حرکت کنه<br>
    توپ رو با راکت بزن و آجرها رو بشکن<br>
    ۳ تا جون داری
  </p>
  <button class="btn" id="startBtn" onclick="startGame()">شروع بازی</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();

let paddle, ball, bricks, particles;
let score, lives, level;
let gameRunning = false;
let lastTime = 0;
let targetPaddleX = 0;

function initGame() {
  paddle = {
    w: 100, h: 15,
    x: W/2 - 50,
    y: H - 60,
    speed: 8
  };
  ball = {
    x: W/2, y: H/2,
    r: 8,
    vx: 3 * (Math.random() > 0.5 ? 1 : -1),
    vy: -5
  };
  bricks = [];
  particles = [];
  score = 0;
  lives = 3;
  level = 1;
  targetPaddleX = W/2;
  createBricks();
}

function createBricks() {
  bricks = [];
  const cols = 7;
  const rows = 5;
  const brickW = (W - 40) / cols;
  const brickH = 30;
  const colors = ['#ff3366', '#ff00ff', '#ffaa00', '#00ff88', '#00ffff'];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      bricks.push({
        x: 20 + c * brickW,
        y: 80 + r * (brickH + 8),
        w: brickW - 6,
        h: brickH,
        color: colors[r % colors.length],
        alive: true
      });
    }
  }
}

function createExplosion(x, y, color) {
  for (let i = 0; i < 15; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = Math.random() * 5 + 1;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1,
      color: color,
      size: Math.random() * 3 + 2
    });
  }
}

function update() {
  if (!gameRunning) return;

  // حرکت راکت
  paddle.x += (targetPaddleX - paddle.w/2 - paddle.x) * 0.3;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  // حرکت توپ
  ball.x += ball.vx;
  ball.y += ball.vy;

  // برخورد با دیوار
  if (ball.x - ball.r < 0) {
    ball.x = ball.r;
    ball.vx *= -1;
  }
  if (ball.x + ball.r > W) {
    ball.x = W - ball.r;
    ball.vx *= -1;
  }
  if (ball.y - ball.r < 0) {
    ball.y = ball.r;
    ball.vy *= -1;
  }

  // برخورد با راکت
  if (ball.y + ball.r > paddle.y &&
      ball.y - ball.r < paddle.y + paddle.h &&
      ball.x > paddle.x &&
      ball.x < paddle.x + paddle.w &&
      ball.vy > 0) {
    ball.y = paddle.y - ball.r;
    // زاویه بر اساس محل برخورد
    const hitPos = (ball.x - paddle.x) / paddle.w;
    const angle = (hitPos - 0.5) * Math.PI * 0.8;
    const speed = Math.hypot(ball.vx, ball.vy);
    ball.vx = Math.sin(angle) * speed;
    ball.vy = -Math.cos(angle) * speed;
  }

  // برخورد با آجرها
  for (let i = 0; i < bricks.length; i++) {
    const b = bricks[i];
    if (!b.alive) continue;

    if (ball.x + ball.r > b.x &&
        ball.x - ball.r < b.x + b.w &&
        ball.y + ball.r > b.y &&
        ball.y - ball.r < b.y + b.h) {

      b.alive = false;
      score += 10;
      createExplosion(b.x + b.w/2, b.y + b.h/2, b.color);

      // تشخیص جهت برخورد
      const overlapLeft = (ball.x + ball.r) - b.x;
      const overlapRight = (b.x + b.w) - (ball.x - ball.r);
      const overlapTop = (ball.y + ball.r) - b.y;
      const overlapBottom = (b.y + b.h) - (ball.y - ball.r);

      const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

      if (minOverlap === overlapLeft || minOverlap === overlapRight) {
        ball.vx *= -1;
      } else {
        ball.vy *= -1;
      }
      break;
    }
  }

  // برد
  if (bricks.every(b => !b.alive)) {
    level++;
    createBricks();
    ball.x = W/2;
    ball.y = H/2;
    ball.vx = 3 * (Math.random() > 0.5 ? 1 : -1);
    ball.vy = -5;
  }

  // باخت جون
  if (ball.y - ball.r > H) {
    lives--;
    if (lives <= 0) {
      endGame();
      return;
    }
    ball.x = W/2;
    ball.y = H/2;
    ball.vx = 3 * (Math.random() > 0.5 ? 1 : -1);
    ball.vy = -5;
    targetPaddleX = W/2;
  }

  // ذرات
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= 0.02;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function draw() {
  // پس‌زمینه
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  // آجرها
  bricks.forEach(b => {
    if (!b.alive) return;
    ctx.shadowBlur = 15;
    ctx.shadowColor = b.color;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.roundRect(b.x, b.y, b.w, b.h, 5);
    ctx.fill();
  });

  // راکت
  ctx.shadowBlur = 25;
  ctx.shadowColor = '#00ffff';
  ctx.fillStyle = '#00ffff';
  ctx.beginPath();
  ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 8);
  ctx.fill();

  // توپ
  ctx.shadowBlur = 25;
  ctx.shadowColor = '#ff00ff';
  ctx.fillStyle = '#ff00ff';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();

  // ذرات
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.shadowBlur = 15;
    ctx.shadowColor = p.color;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // امتیاز و جون
  ctx.fillStyle = '#00ffff';
  ctx.font = 'bold 20px Tahoma';
  ctx.textAlign = 'left';
  ctx.fillText('امتیاز: ' + score, 20, 35);
  ctx.textAlign = 'right';
  ctx.fillText('❤️'.repeat(lives), W - 20, 35);
  ctx.textAlign = 'center';
  ctx.fillText('مرحله ' + level, W/2, 35);
}

// roundRect
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (r > w/2) r = w/2;
    if (r > h/2) r = h/2;
    this.beginPath();
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

function gameLoop(time) {
  if (time - lastTime > 16) {
    update();
    draw();
    lastTime = time;
  }
  requestAnimationFrame(gameLoop);
}

function startGame() {
  initGame();
  gameRunning = true;
  document.getElementById('overlay').classList.add('hide');
}

function endGame() {
  gameRunning = false;
  document.getElementById('title').textContent = 'بازی تموم شد!';
  document.getElementById('message').textContent = 'امتیاز نهایی: ' + score;
  document.getElementById('startBtn').textContent = 'دوباره';
  document.getElementById('overlay').classList.remove('hide');
}

// کنترل با لمس — فقط وقتی بازی شروع شده
function handleMove(e) {
  if (!gameRunning) return;
  e.preventDefault();
  const t = e.touches ? e.touches[0] : e;
  if (t) targetPaddleX = t.clientX;
}

document.addEventListener('touchstart', handleMove, {passive: false});
document.addEventListener('touchmove', handleMove, {passive: false});
document.addEventListener('mousemove', handleMove);

initGame();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
